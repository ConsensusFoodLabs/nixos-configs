# Compositor settings. Carried over unchanged from mingaleg/nixos-config: the
# point of running picom at all here is to stop tearing on Intel graphics, so
# everything decorative stays off.

# xrender is more stable than glx on Intel.
backend = "xrender";

vsync = true;

unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;

# refresh-rate is gone: picom 13 removed it and warns if it is set. It only
# ever mattered when picom had to guess the frame timing itself, which vsync
# and the present extension now handle.

fading = false;
shadow = false;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

corner-radius = 0;
blur-background = false;
